CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_EEPROM=y
CONFIG_EEPROM_SIMULATOR=y

CONFIG_SQNANO=y
CONFIG_SQNANO_PROFILE_STANDARD=y
# The simulated flash erases 1 KiB sectors: 1 KiB pages.
CONFIG_SQNANO_MAX_PAGE_SIZE=1024
CONFIG_SQNANO_MAX_STMTS=6
