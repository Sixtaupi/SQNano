#
# Build and test: the host suite (gcc, clang with sanitizers, macOS), then
# the Zephyr tests under Twister and the footprint of the sample.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Zephyr release the module is tested against.
  ZEPHYR_REV: v4.5.0-rc3

jobs:
  host:
    name: host (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            os: ubuntu-24.04
            cc: gcc
            cmake: -DCMAKE_BUILD_TYPE=Release
          - name: clang, ASan + UBSan
            os: ubuntu-24.04
            cc: clang
            cmake: -DCMAKE_BUILD_TYPE=Debug -DSQNANO_SANITIZE=ON
          - name: macOS
            os: macos-latest
            cc: clang
            cmake: -DCMAKE_BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.cmake }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        # Includes the power-cut fuzzing, the differential test against
        # SQLite, the OTA scenarios and a short pass of each fuzz target.
        run: ctest --test-dir build -j4 --output-on-failure --timeout 900

  zephyr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: sqnano
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build gperf ccache \
            device-tree-compiler qemu-system-x86 xz-utils file
      - name: Workspace cache
        uses: actions/cache@v4
        with:
          path: |
            zp
            ~/zephyr-sdk-*
          key: zephyr-${{ env.ZEPHYR_REV }}-${{ hashFiles('sqnano/.github/workflows/ci.yml') }}
      - name: West workspace
        run: |
          pip install -q west
          if [ ! -d zp/.west ]; then
            west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REV" zp
          fi
          cd zp
          # Only the modules the tests need (NXP HAL for the footprint board).
          west config manifest.project-filter -- '-.*,+zephyr,+cmsis_6,+hal_nxp,+littlefs,+zcbor'
          west update --narrow -o=--depth=1
          pip install -q -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt
          ls -d ~/zephyr-sdk-* >/dev/null 2>&1 || \
            west sdk install -t x86_64-zephyr-elf arm-zephyr-eabi
      - name: Twister
        working-directory: zp
        run: |
          west twister -T ../sqnano/tests/zephyr -T ../sqnano/samples/zephyr \
            -p qemu_x86 --inline-logs -v --outdir ../twister-out
      - name: Footprint (frdm_k64f)
        working-directory: zp
        run: |
          west build -p always -b frdm_k64f ../sqnano/samples/zephyr/sensor_log -d ../fp \
            | tee ../fp.log
          {
            echo '### Footprint: samples/zephyr/sensor_log on frdm_k64f'
            echo '```'
            grep -E 'FLASH:|RAM:' ../fp.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Twister report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: twister
          path: |
            twister-out/twister.json
            twister-out/**/handler.log
            twister-out/**/build.log
